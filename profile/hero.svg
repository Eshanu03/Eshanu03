<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="380"
  viewBox="0 0 1200 380"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Eshanu Mondal — Web Designer, Graphics Designer &amp; UI/UX Creator</title>
  <desc id="desc">
    Personal GitHub profile hero for Eshanu Mondal, combining design and development.
  </desc>

  <defs>

    <!-- Background -->
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080b10"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Main accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Soft glow -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 40 0 L 0 0 0 40"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.035"
        stroke-width="1"
      />
    </pattern>

    <!-- Glow filter -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="smallGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <!-- Clip -->
    <clipPath id="rounded">
      <rect
        x="1"
        y="1"
        width="1198"
        height="378"
        rx="24"
      />
    </clipPath>

  </defs>


  <!-- ========================================================= -->
  <!-- BACKGROUND -->
  <!-- ========================================================= -->

  <rect
    width="1200"
    height="380"
    rx="24"
    fill="url(#background)"
  />

  <rect
    width="1200"
    height="380"
    fill="url(#grid)"
    clip-path="url(#rounded)"
  />

  <!-- Ambient glow -->
  <ellipse
    cx="970"
    cy="190"
    rx="310"
    ry="250"
    fill="url(#glow)"
    filter="url(#blur)"
  />

  <ellipse
    cx="150"
    cy="70"
    rx="220"
    ry="160"
    fill="url(#glow)"
    filter="url(#blur)"
  />


  <!-- ========================================================= -->
  <!-- DECORATIVE NETWORK -->
  <!-- ========================================================= -->

  <g
    fill="none"
    stroke="url(#accent)"
    stroke-width="1"
    stroke-opacity="0.28"
  >

    <path d="M790 65 L910 105 L1035 65 L1130 125"/>
    <path d="M910 105 L950 190 L1080 210 L1160 175"/>
    <path d="M1035 65 L1080 210"/>
    <path d="M950 190 L850 255 L960 305 L1090 275"/>
    <path d="M1080 210 L1090 275"/>
    <path d="M850 255 L795 310"/>

  </g>


  <!-- Network nodes -->

  <g>

    <circle cx="790" cy="65" r="3" fill="#58a6ff"/>
    <circle cx="910" cy="105" r="4" fill="#8b5cf6"/>
    <circle cx="1035" cy="65" r="3" fill="#38bdf8"/>
    <circle cx="1130" cy="125" r="4" fill="#58a6ff"/>

    <circle cx="950" cy="190" r="4" fill="#8b5cf6"/>
    <circle cx="1080" cy="210" r="5" fill="#38bdf8"/>
    <circle cx="1160" cy="175" r="3" fill="#58a6ff"/>

    <circle cx="850" cy="255" r="4" fill="#58a6ff"/>
    <circle cx="960" cy="305" r="5" fill="#8b5cf6"/>
    <circle cx="1090" cy="275" r="4" fill="#38bdf8"/>
    <circle cx="795" cy="310" r="3" fill="#58a6ff"/>

  </g>


  <!-- Animated network pulse -->

  <circle
    cx="1080"
    cy="210"
    r="7"
    fill="none"
    stroke="#38bdf8"
    stroke-width="1"
    opacity="0.7"
  >
    <animate
      attributeName="r"
      values="7;22;7"
      dur="3s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.7;0;0.7"
      dur="3s"
      repeatCount="indefinite"
    />
  </circle>


  <circle
    cx="910"
    cy="105"
    r="6"
    fill="none"
    stroke="#8b5cf6"
    stroke-width="1"
    opacity="0.6"
  >
    <animate
      attributeName="r"
      values="6;18;6"
      dur="4s"
      begin="1s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.6;0;0.6"
      dur="4s"
      begin="1s"
      repeatCount="indefinite"
    />
  </circle>


  <!-- ========================================================= -->
  <!-- LEFT CONTENT -->
  <!-- ========================================================= -->

  <!-- Small status line -->

  <g transform="translate(75 68)">

    <circle
      cx="6"
      cy="0"
      r="5"
      fill="#3fb950"
    >
      <animate
        attributeName="opacity"
        values="1;0.35;1"
        dur="2s"
        repeatCount="indefinite"
      />
    </circle>

    <text
      x="20"
      y="5"
      fill="#8b949e"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
      font-size="13"
      letter-spacing="2"
    >
      DIGITAL CREATOR
    </text>

  </g>


  <!-- Name -->

  <text
    x="75"
    y="145"
    fill="#ffffff"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="-1.5"
  >
    Eshanu Mondal
  </text>


  <!-- Accent line -->

  <rect
    x="77"
    y="165"
    width="105"
    height="4"
    rx="2"
    fill="url(#accent)"
  >
    <animate
      attributeName="width"
      values="45;105;45"
      dur="4s"
      repeatCount="indefinite"
    />
  </rect>


  <!-- Main role -->

  <text
    x="75"
    y="215"
    fill="#dbeafe"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="22"
    font-weight="500"
  >
    Web Designer
  </text>

  <text
    x="238"
    y="215"
    fill="#475569"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="21"
  >
    •
  </text>

  <text
    x="265"
    y="215"
    fill="#d8b4fe"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="22"
    font-weight="500"
  >
    Graphics Designer
  </text>


  <!-- Second role -->

  <text
    x="75"
    y="248"
    fill="#93c5fd"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="20"
    font-weight="400"
  >
    UI/UX Creator
  </text>


  <!-- Description -->

  <text
    x="75"
    y="292"
    fill="#8b949e"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
    font-size="14"
    letter-spacing="0.2"
  >
    Designing interfaces. Building experiences. Creating digital products.
  </text>


  <!-- ========================================================= -->
  <!-- BOTTOM META -->
  <!-- ========================================================= -->

  <g transform="translate(75 335)">

    <text
      x="0"
      y="0"
      fill="#58a6ff"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
      font-size="11"
      font-weight="600"
      letter-spacing="1.5"
    >
      DESIGN
    </text>

    <circle
      cx="70"
      cy="-4"
      r="2"
      fill="#30363d"
    />

    <text
      x="88"
      y="0"
      fill="#8b949e"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
      font-size="11"
      font-weight="600"
      letter-spacing="1.5"
    >
      DEVELOPMENT
    </text>

    <circle
      cx="205"
      cy="-4"
      r="2"
      fill="#30363d"
    />

    <text
      x="223"
      y="0"
      fill="#8b949e"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
      font-size="11"
      font-weight="600"
      letter-spacing="1.5"
    >
      EXPERIENCE
    </text>

  </g>


  <!-- ========================================================= -->
  <!-- RIGHT VISUAL MARK -->
  <!-- ========================================================= -->

  <g transform="translate(1015 190)">

    <!-- Outer rings -->

    <circle
      cx="0"
      cy="0"
      r="72"
      fill="none"
      stroke="#30363d"
      stroke-width="1"
    />

    <circle
      cx="0"
      cy="0"
      r="54"
      fill="none"
      stroke="url(#accent)"
      stroke-width="1"
      stroke-opacity="0.45"
      stroke-dasharray="3 8"
    >
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="18s"
        repeatCount="indefinite"
      />
    </circle>

    <circle
      cx="0"
      cy="0"
      r="36"
      fill="#0d1117"
      stroke="#58a6ff"
      stroke-opacity="0.45"
    />


    <!-- Geometric mark -->

    <path
      d="M-18 15 L-18 -14 L0 -27 L18 -14 L18 15 L0 27 Z"
      fill="none"
      stroke="url(#accent)"
      stroke-width="2"
    />

    <path
      d="M-18 0 L0 12 L18 0"
      fill="none"
      stroke="#58a6ff"
      stroke-width="1.5"
      stroke-opacity="0.8"
    />

    <path
      d="M0 -27 L0 27"
      fill="none"
      stroke="#8b5cf6"
      stroke-width="1"
      stroke-opacity="0.7"
    />


    <!-- Center point -->

    <circle
      cx="0"
      cy="0"
      r="4"
      fill="#ffffff"
    >
      <animate
        attributeName="r"
        values="3;5;3"
        dur="2s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values="1;0.65;1"
        dur="2s"
        repeatCount="indefinite"
      />
    </circle>

  </g>


  <!-- ========================================================= -->
  <!-- FLOATING PARTICLES -->
  <!-- ========================================================= -->

  <g fill="#58a6ff">

    <circle cx="735" cy="95" r="2">
      <animate
        attributeName="cy"
        values="95;82;95"
        dur="4s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values="0.25;1;0.25"
        dur="4s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="740" cy="300" r="2">
      <animate
        attributeName="cy"
        values="300;288;300"
        dur="5s"
        begin="1s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values="0.2;0.8;0.2"
        dur="5s"
        begin="1s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="1140" cy="315" r="2">
      <animate
        attributeName="cy"
        values="315;302;315"
        dur="4.5s"
        begin="0.5s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values="0.2;0.9;0.2"
        dur="4.5s"
        begin="0.5s"
        repeatCount="indefinite"
      />
    </circle>

  </g>


  <!-- ========================================================= -->
  <!-- BORDER -->
  <!-- ========================================================= -->

  <rect
    x="1"
    y="1"
    width="1198"
    height="378"
    rx="24"
    fill="none"
    stroke="#30363d"
    stroke-width="1"
  />

  <!-- Animated border accent -->

  <path
    d="M25 1 H300"
    fill="none"
    stroke="url(#accent)"
    stroke-width="2"
    stroke-linecap="round"
  >
    <animate
      attributeName="stroke-opacity"
      values="0.25;1;0.25"
      dur="3s"
      repeatCount="indefinite"
    />
  </path>

</svg>
