<svg xmlns="http://www.w3.org/2000/svg"
width="900"
height="300"
viewBox="0 0 900 300">

  <defs>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f172a"/>
      <stop offset="50%" stop-color="#a12131"/>
      <stop offset="100%" stop-color="#c24156"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#a12131" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <pattern
      id="grid"
      width="30"
      height="30"
      patternUnits="userSpaceOnUse">

      <path
        d="M 30 0 L 0 0 0 30"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.025"
        stroke-width="1"/>

    </pattern>

  </defs>

  <!-- Background -->

  <rect
    width="900"
    height="300"
    rx="18"
    fill="#0d1117"/>

  <rect
    width="900"
    height="300"
    rx="18"
    fill="url(#grid)"/>

  <!-- Ambient glow -->

  <ellipse
    cx="820"
    cy="150"
    rx="240"
    ry="180"
    fill="url(#glow)"/>

  <!-- Border -->

  <rect
    x="1"
    y="1"
    width="898"
    height="298"
    rx="18"
    fill="none"
    stroke="#30363d"/>

  <!-- Accent line -->

  <rect
    x="1"
    y="1"
    width="898"
    height="3"
    rx="2"
    fill="url(#accent)"/>

  <!-- Title -->

  <text
    x="40"
    y="55"
    fill="#d05d30"
    font-family="Arial, sans-serif"
    font-size="26"
    font-weight="bold">

    GitHub Statistics

  </text>

  <!-- Username -->

  <text
    x="40"
    y="82"
    fill="#8b949e"
    font-family="Arial, sans-serif"
    font-size="15">

    @Eshanu03

  </text>

  <!-- Repository -->

  <text
    x="80"
    y="145"
    fill="#ffffff"
    font-family="Arial, sans-serif"
    font-size="30"
    font-weight="bold">

    2

  </text>

  <text
    x="80"
    y="170"
    fill="#8b949e"
    font-family="Arial, sans-serif"
    font-size="14">

    Repositories

  </text>

  <!-- Contributions -->

  <text
    x="260"
    y="145"
    fill="#ffffff"
    font-family="Arial, sans-serif"
    font-size="30"
    font-weight="bold">

    44

  </text>

  <text
    x="260"
    y="170"
    fill="#8b949e"
    font-family="Arial, sans-serif"
    font-size="14">

    Contributions

  </text>

  <!-- Stars -->

  <text
    x="460"
    y="145"
    fill="#ffffff"
    font-family="Arial, sans-serif"
    font-size="30"
    font-weight="bold">

    0

  </text>

  <text
    x="460"
    y="170"
    fill="#8b949e"
    font-family="Arial, sans-serif"
    font-size="14">

    Stars

  </text>

  <!-- Followers -->

  <text
    x="650"
    y="145"
    fill="#ffffff"
    font-family="Arial, sans-serif"
    font-size="30"
    font-weight="bold">

    0

  </text>

  <text
    x="650"
    y="170"
    fill="#8b949e"
    font-family="Arial, sans-serif"
    font-size="14">

    Followers

  </text>

  <!-- Bottom divider -->

  <line
    x1="40"
    y1="215"
    x2="860"
    y2="215"
    stroke="#30363d"
    stroke-width="1"/>

  <!-- Footer -->

  <text
    x="40"
    y="250"
    fill="#8b949e"
    font-family="Arial, sans-serif"
    font-size="13">

    Automatically generated by GitHub Actions

  </text>

  <!-- Accent indicator -->

  <circle
    cx="840"
    cy="245"
    r="5"
    fill="#a12131"/>

  <circle
    cx="840"
    cy="245"
    r="10"
    fill="none"
    stroke="#a12131"
    stroke-opacity="0.25"/>

</svg>